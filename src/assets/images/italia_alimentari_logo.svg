<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 355 48" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&amp;display=swap');
      .title-text {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.025em;
        fill: #151515;
      }
      .tagline-text {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11.2px;
        font-weight: 500;
        letter-spacing: -0.015em;
        fill: #68645B;
      }
    </style>
  </defs>
  <!-- Main Brand Title: Italia -->
  <text x="0" y="27" class="title-text">Italia</text>

  <!-- Ligature Bridge connecting lowercase 'a' and uppercase 'A' -->
  <rect x="85.5" y="17.2" width="7" height="3" rx="0.5" fill="#151515" />

  <!-- Main Brand Title: Alimentari -->
  <text x="89.5" y="27" class="title-text">Alimentari</text>

  <!-- Payoff Tagline -->
  <text x="90.5" y="43" class="tagline-text">Salumi e snack che guardano al futuro</text>
</svg>